[package]
name = "upscale-core"
description = "Upscale engine: tools, probe, analysis, planning, pipelines and queue. No Tauri dependency."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "upscale_core"

[[bin]]
name = "upscale-cli"
path = "src/bin/upscale-cli.rs"

[dependencies]
anyhow.workspace = true
chrono = "0.4.45"
clap.workspace = true
fs4 = "1.1.0"
futures-util = "0.3.34"
pgp = "0.21.0"
regex = "1.13.1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal"] }
which = "8.0.6"

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Power", "Win32_System_Threading", "Win32_UI_Shell"] }
